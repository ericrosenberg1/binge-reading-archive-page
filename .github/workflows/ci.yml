name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Check PHP syntax
        run: find . -name "*.php" | xargs -n1 php -l
