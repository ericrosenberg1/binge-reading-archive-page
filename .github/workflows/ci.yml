name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

permissions:
  contents: read

env:
  # Opt in to Node.js 24 ahead of GitHub's forced cutover on 2026-06-02.
  # Remove once the actions used here ship versions that default to Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Check PHP syntax
        run: find . -name "*.php" | xargs -n1 php -l
